<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Personal Library</h1>
        <button id="show-dialog">+ Add New Book</button>
    </header>

    <div id="library-container"></div>

    <dialog id="book-dialog">
        <form method="dialog" id="book-form">
            <h2>Add New Book</h2>
            
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required>

            <label for="pages">Pages:</label>
            <input type="number" id="pages" name="pages" required>

            <div class="checkbox-group">
                <label for="read">Have you read it?</label>
                <input type="checkbox" id="read" name="read">
            </div>

            <div class="form-buttons">
                <button type="button" id="close-dialog">Cancel</button>
                <button type="submit" id="submit-book">Confirm</button>
            </div>
        </form>
    </dialog>
</body>
</html>
